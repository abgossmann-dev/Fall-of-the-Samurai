  <text x="856" y="408" fill="#CBD5E1" font-size="13" font-family="Inter, Arial, sans-serif">Surface: #111827 / #1E293B</text>
  <text x="856" y="430" fill="#CBD5E1" font-size="13" font-family="Inter, Arial, sans-serif">Primary: #3B82F6</text>
  <text x="856" y="452" fill="#CBD5E1" font-size="13" font-family="Inter, Arial, sans-serif">Success: #22C55E</text>
  <text x="856" y="474" fill="#CBD5E1" font-size="13" font-family="Inter, Arial, sans-serif">Text: #F8FAFC / #CBD5E1 / #94A3B8</text>

  <text x="836" y="546" fill="#94A3B8" font-size="12" font-family="Inter, Arial, sans-serif">Preview artifact for discussion, not final UI spec.</text>
