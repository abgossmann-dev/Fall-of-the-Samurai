  <!-- Notes panel -->
  <rect x="810" y="110" width="350" height="620" rx="20" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="836" y="150" fill="#F8FAFC" font-size="20" font-family="Inter, Arial, sans-serif" font-weight="700">Style Notes</text>
  <text x="836" y="182" fill="#CBD5E1" font-size="14" font-family="Inter, Arial, sans-serif">• Athletic dark UI with high contrast cards</text>
  <text x="836" y="208" fill="#CBD5E1" font-size="14" font-family="Inter, Arial, sans-serif">• Big tap targets (>=44px equivalent)</text>
  <text x="836" y="234" fill="#CBD5E1" font-size="14" font-family="Inter, Arial, sans-serif">• Fast in-session controls (+/- and check)</text>
  <text x="836" y="260" fill="#CBD5E1" font-size="14" font-family="Inter, Arial, sans-serif">• Sticky primary actions at bottom</text>
  <text x="836" y="286" fill="#CBD5E1" font-size="14" font-family="Inter, Arial, sans-serif">• Dashboard cards prioritize next action</text>

  <rect x="836" y="328" width="300" height="168" rx="14" fill="#1E293B"/>
  <text x="856" y="358" fill="#F8FAFC" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="700">Suggested tokens</text>
