  <rect x="604" y="271" width="22" height="22" rx="6" fill="#334155"/><text x="611" y="287" fill="#F8FAFC" font-size="14" font-family="Inter, Arial, sans-serif">+</text>

  <rect x="632" y="271" width="22" height="22" rx="6" fill="#334155"/><text x="639" y="287" fill="#F8FAFC" font-size="14" font-family="Inter, Arial, sans-serif">−</text>
  <rect x="656" y="271" width="40" height="22" rx="6" fill="#1E293B"/><text x="669" y="287" fill="#F8FAFC" font-size="13" font-family="Inter, Arial, sans-serif">185</text>
